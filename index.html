<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spider Sequencer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="bar">
  <div class="brand"><b>SPIDER</b><span>Sequencer</span></div>
  <div class="grp"><span class="lbl">Transport</span>
    <div class="row">
      <button id="play" class="play" aria-label="Play"></button>
      <button id="rew" class="icon" aria-label="Back to start" title="Back to start"><i data-i="skip-back"></i></button>
    </div>
  </div>
  <div class="grp"><span class="lbl">Play</span>
    <div class="row seg" id="playSeg"></div>
  </div>
  <div class="grp bpm"><label class="lbl" for="bpm">BPM</label>
    <div class="row"><button class="icon" data-bpm="-1" aria-label="Slower" title="Slower (Shift: −10)"><i data-i="minus"></i></button><input id="bpm" type="number" min="40" max="240" step="1"><button class="icon" data-bpm="1" aria-label="Faster" title="Faster (Shift: +10)"><i data-i="plus"></i></button></div>
  </div>
  <div class="grp"><span class="lbl">Radius =</span><div class="row seg" id="modeSeg"></div></div>
  <div class="grp"><span class="lbl">Snap</span><div class="row seg" id="snapSeg"></div></div>
  <div class="grp"><span class="lbl">Key</span><div class="row"><select id="root" aria-label="Root note"></select><select id="scale" aria-label="Scale"></select></div></div>
  <div class="spacer"></div>
  <div class="grp"><span class="lbl">More</span><div class="row"><button id="settingsBtn" class="icon" aria-label="Open settings" title="Settings"><i data-i="settings"></i></button><button id="helpBtn" class="icon" aria-label="Open help" title="Help"><i data-i="info"></i></button></div></div>
</header>

<main>
  <section class="stage" aria-label="Circular editor">
    <div class="svgwrap"><svg id="stage" viewBox="-520 -520 1040 1040" preserveAspectRatio="xMidYMid meet">
      <g id="grid"></g><g id="layers"></g>
    </svg></div>
    <div class="tools">
      <div class="readout" id="readout"></div>
      <button id="rotL" class="icon" title="Rotate track one step back" aria-label="Rotate back"><i data-i="rotate-ccw"></i></button>
      <button id="rotR" class="icon" title="Rotate track one step forward" aria-label="Rotate forward"><i data-i="rotate-cw"></i></button>
      <button id="rand" title="Fill the selected track with random notes"><i data-i="shuffle"></i>Random</button>
      <button id="clear" title="Remove all notes from the selected track in its current pattern"><i data-i="trash-2"></i>Clear</button>
      <button id="undo" title="Undo (Ctrl/⌘+Z)"><i data-i="corner-up-left"></i>Undo</button>
    </div>
    <div class="arr" aria-label="Patterns and song">
      <div class="arr-row">
        <span class="arr-lbl lbl" title="Switch every track to the same pattern">All tracks</span>
        <div id="patBtns" role="group" aria-label="Patterns"></div>
        <select id="patBars" aria-label="Pattern length in the song" title="How long this pattern lasts in the song"></select>
        <button id="patCopy" title="Duplicate this pattern for all tracks into the next empty slot"><i data-i="copy"></i>Duplicate</button>
        <button id="patClear" title="Remove all notes from this pattern on every track"><i data-i="trash-2"></i>Clear</button>
      </div>
      <div class="arr-row">
        <span class="arr-lbl lbl">Song</span>
        <div id="lane"></div>
        <button id="slotAdd" title="Append the pattern to the song"><i data-i="plus"></i><span id="slotAddLbl">A</span></button>
        <button id="slotL" class="icon" title="Move block left" aria-label="Move block left"><i data-i="arrow-left"></i></button>
        <button id="slotR" class="icon" title="Move block right" aria-label="Move block right"><i data-i="arrow-right"></i></button>
        <button id="slotMinus" class="icon" title="Fewer repeats" aria-label="Fewer repeats"><i data-i="minus"></i></button>
        <button id="slotPlus" class="icon" title="More repeats" aria-label="More repeats"><i data-i="plus"></i></button>
        <button id="slotDel" class="icon" title="Remove block" aria-label="Remove block"><i data-i="x"></i></button>
      </div>
    </div>
  </section>
  <aside class="panel">
    <div class="panel-head"><h2>Tracks</h2><button id="exportBtn" title="Export everything as JSON"><i data-i="download"></i>Export</button><button id="importBtn" title="Import a JSON file"><i data-i="upload"></i>Import</button><button id="addTrk" title="Add a track"><i data-i="plus"></i>Add</button></div>
    <ul id="tracks"></ul>
    <div class="grp setbox"><span class="lbl">Starter set · replaces tracks, patterns and song</span><div class="row"><select id="setSel" aria-label="Starter set"></select><button id="loadSet"><i data-i="refresh-cw"></i>Load</button></div></div>
  </aside>
</main>

<script type="module" src="/js/main.js"></script>
</body>
</html>
